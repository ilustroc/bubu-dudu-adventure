<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#91dcf4" />
    <title>Nivel 1 | Bubu &amp; Dudu al Rescate</title>
    <link rel="stylesheet" href="/src/game/game.css" />

  <body class="game-page">
    <main class="game-shell">

    <script type="module" src="/src/game/boot.js"></script>
