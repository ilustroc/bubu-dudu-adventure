<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bubu & Dudu | Al Rescate</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="body align-items-center">
      <div class="jumbotron bg-light p-5">
        <h1 class="display-4">Bubu & Dudu | Al Rescate</h1>

        <p class="lead">
          Elige tu personaje favorito para comenzar la aventura.
        </p>

        <button class="character" data-character="bubu">
          <img
            src="assets/images/bubu.png"
            alt="Elegir a Bubu"
            style="width: 100px; height: 100px"
          />
        </button>

        <button class="character" data-character="dudu">
          <img
            src="assets/images/dudu.png"
            alt="Elegir a Dudu"
            style="width: 100px; height: 100px"
          />
        </button>

        <p id="character-selection" class="mt-3"></p>

        <div class="mt-4 d-flex flex-column align-items-center">
          <button class="btn btn-primary mb-2">
            Jugar
          </button>
          <button class="btn btn-success mb-2">Tienda</button>
          <button class="btn btn-secondary mb-2">Opciones</button>
        </div>
      </div>
    </div>
  </body>
  <script
    src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
    integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
    crossorigin="anonymous"
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
    integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
    crossorigin="anonymous"
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
    integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
    crossorigin="anonymous"
  ></script>
  <script src="assets/js/main.js"></script>
</html>
